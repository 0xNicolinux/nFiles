[package]
name = "file-organizer"
version = "0.1.0"
edition = "2021"
authors = ["File Organizer Contributors"]
description = "A cross-platform CLI tool to automatically organize files into categorized directories based on extension."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
anyhow = "1.0"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"
